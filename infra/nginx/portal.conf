server {
    listen 8090;
    server_name _;

    # 上传大文件（dashcam_clips.zip ~100MB + 余量）
    client_max_body_size 220m;

    # 前端静态资源（Vue3 SPA）
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Python 处理服务（PROC 模块全部接口）
    location /api/processing/ {
        proxy_pass http://processing-app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Java 平台（其余 /api/** 与开放 API）
    location /api/ {
        proxy_pass http://platform-app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location /openapi/ {
        proxy_pass http://platform-app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # /internal/** 不对外：无 location 规则，默认 404（内部接口仅容器网络可达）
}
