name: mydatama

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    command: >
      postgres -c shared_buffers=512MB -c work_mem=4MB -c max_wal_size=1GB
    deploy:
      resources:
        limits: { memory: 1G, cpus: "1.0" }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  platform-app:
    build: ./backend-java
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?stringtype=unspecified
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_HMAC_SECRET: ${JWT_HMAC_SECRET}
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      JAVA_PROCESSING_BASE_URL: http://processing-app:8000
      STORAGE_ROOT: /data
      JAVA_OPTS: "-Xmx640m -XX:+UseG1GC"
    volumes:
      - mydatama-data:/data
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 768M, cpus: "1.0" }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  processing-app:
    build: ./processing-service
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_HMAC_SECRET: ${JWT_HMAC_SECRET}
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      JAVA_INTERNAL_BASE_URL: http://platform-app:8080
      STORAGE_ROOT: /data
      WORKER_THREADS: "2"
      POLL_INTERVAL: "2"
      JOB_LOCK_TIMEOUT_MINUTES: "10"
      PYTHONUNBUFFERED: "1"
    volumes:
      - mydatama-data:/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 384M, cpus: "1.0" }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  portal-nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./infra/nginx/portal.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8090:8090"
    depends_on:
      platform-app: { condition: service_healthy }
      processing-app: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 64M, cpus: "0.2" }
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8090/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  pg-data:
  mydatama-data:
